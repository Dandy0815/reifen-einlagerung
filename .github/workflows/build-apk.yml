name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bibliotheken holen
        run: |
          npm install --no-audit --no-fund
          node scripts/prepare-assets.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android-SDK vorbereiten
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Feste Signatur verwenden
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Reifen-Einlagerung-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Download-Link bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Reifen-Einlagerung.apk
          gh release delete apk-aktuell --cleanup-tag --yes || true
          gh release create apk-aktuell Reifen-Einlagerung.apk \
            --title "Reifen Einlagerung (aktuelle APK)" \
            --notes "Auf dem Tablet auf Reifen-Einlagerung.apk tippen, herunterladen und installieren." \
            --target "$GITHUB_SHA"
